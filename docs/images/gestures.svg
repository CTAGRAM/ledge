<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c2131"/>
      <stop offset="1" stop-color="#131722"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2c3247"/>
      <stop offset="1" stop-color="#232838"/>
    </linearGradient>
    <linearGradient id="orange" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc061"/>
      <stop offset="1" stop-color="#ff8a00"/>
    </linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6cc7ff"/>
      <stop offset="1" stop-color="#0a7cff"/>
    </linearGradient>
    <clipPath id="padClip"><rect x="40" y="64" width="440" height="272" rx="24"/></clipPath>
    <marker id="tip" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,1 L9,5 L0,9 z" fill="#ffffff" fill-opacity="0.7"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="879" height="399" rx="20" fill="url(#card)" stroke="#2c3247"/>

  <!-- Trackpad -->
  <rect x="40" y="64" width="440" height="272" rx="24" fill="url(#pad)"/>
  <g clip-path="url(#padClip)">
    <rect x="40" y="64" width="31" height="272" fill="#ff9f1a" fill-opacity="0.16"/>
    <rect x="40" y="186" width="31" height="150" fill="url(#orange)"/>
    <rect x="449" y="64" width="31" height="272" fill="#0a84ff" fill-opacity="0.18"/>
    <rect x="449" y="146" width="31" height="190" fill="url(#blue)"/>
    <rect x="71" y="306" width="378" height="30" fill="#ffffff" fill-opacity="0.05"/>
  </g>
  <rect x="40.5" y="64.5" width="439" height="271" rx="23.5" fill="none" stroke="#454d6b"/>

  <!-- Media strip glyphs -->
  <g fill="#ffffff" fill-opacity="0.5">
    <path d="M118,315 l-9,6 l9,6 z M108,315 l-9,6 l9,6 z"/>
    <path d="M402,315 l9,6 l-9,6 z M412,315 l9,6 l-9,6 z"/>
  </g>

  <!-- Tap sections -->
  <g fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.38" stroke-dasharray="4 3">
    <rect x="46" y="70" width="52" height="30" rx="9"/>
    <rect x="215" y="70" width="90" height="30" rx="9"/>
    <rect x="422" y="70" width="52" height="30" rx="9"/>
    <rect x="46" y="300" width="52" height="30" rx="9"/>
    <rect x="215" y="300" width="90" height="30" rx="9"/>
    <rect x="422" y="300" width="52" height="30" rx="9"/>
  </g>
  <g fill="#e6e9f5" font-size="10.5" font-weight="600" text-anchor="middle">
    <text x="72" y="89">Timer</text>
    <text x="260" y="89">Open App</text>
    <text x="448" y="89">Mute</text>
    <text x="72" y="319">Spaces</text>
    <text x="260" y="319">Play / Pause</text>
    <text x="448" y="319">Lock</text>
  </g>

  <!-- Levels -->
  <text x="122" y="178" fill="#ffb347" font-size="13" font-weight="600">Brightness</text>
  <text x="120" y="214" fill="#ffffff" font-size="32" font-weight="700">55<tspan font-size="17" fill-opacity="0.6"> %</tspan></text>
  <text x="400" y="178" fill="#5ab4ff" font-size="13" font-weight="600" text-anchor="end">Volume</text>
  <text x="400" y="214" fill="#ffffff" font-size="32" font-weight="700" text-anchor="end">70<tspan font-size="17" fill-opacity="0.6"> %</tspan></text>

  <!-- Two fingers sliding the left edge, one on the right -->
  <circle cx="55.5" cy="214" r="17" fill="#ffb347" fill-opacity="0.28"/>
  <circle cx="55.5" cy="246" r="17" fill="#ffb347" fill-opacity="0.28"/>
  <circle cx="55.5" cy="214" r="9.5" fill="#ffffff"/>
  <circle cx="55.5" cy="246" r="9.5" fill="#ffffff"/>
  <line x1="92" y1="196" x2="92" y2="266" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" marker-start="url(#tip)" marker-end="url(#tip)"/>
  <circle cx="464.5" cy="176" r="17" fill="#0a84ff" fill-opacity="0.3"/>
  <circle cx="464.5" cy="176" r="9.5" fill="#ffffff"/>
  <line x1="428" y1="140" x2="428" y2="212" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" marker-start="url(#tip)" marker-end="url(#tip)"/>

  <!-- Legend -->
  <g font-size="15" font-weight="600" fill="#ffffff">
    <text x="568" y="92">Slide the left edge</text>
    <text x="568" y="154">Slide the right edge</text>
    <text x="568" y="216">Swipe the bottom edge</text>
    <text x="568" y="278">Double-tap a section</text>
    <text x="568" y="340">Rest your palm anywhere</text>
  </g>
  <g font-size="13" fill="#9aa3c0">
    <text x="568" y="112">Brightness, with one finger or two</text>
    <text x="568" y="174">Volume or keyboard light</text>
    <text x="568" y="236">Next or previous track</text>
    <text x="568" y="298">Six areas, each runs your action</text>
    <text x="568" y="360">Palms and resting thumbs are ignored</text>
  </g>
  <rect x="534" y="80" width="10" height="28" rx="5" fill="url(#orange)"/>
  <rect x="534" y="142" width="10" height="28" rx="5" fill="url(#blue)"/>
  <g fill="#ffffff" fill-opacity="0.8">
    <path d="M528,214 l9,6 l-9,6 z M538,214 l9,6 l-9,6 z"/>
  </g>
  <rect x="526" y="268" width="26" height="20" rx="6" fill="#ffffff" fill-opacity="0.07" stroke="#ffffff" stroke-opacity="0.45" stroke-dasharray="4 3"/>
  <ellipse cx="539" cy="340" rx="11" ry="15" fill="#ff453a" fill-opacity="0.6"/>
</svg>
